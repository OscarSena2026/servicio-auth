# Nombre de la aplicacion
spring.application.name=servicio-auth

# Conexion a MySQL (la base auth_db se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=auth_user
# La contrasena NO se escribe aqui para no subirla a GitHub.
# Se toma de la variable de entorno DB_PASSWORD (si no existe, queda vacia).
spring.datasource.password=${DB_PASSWORD:}

# JPA: crea/actualiza la tabla "usuarios" automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto del servicio
server.port=8080
